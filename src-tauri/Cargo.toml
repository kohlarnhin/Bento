[package]
name = "apphub"
version = "0.1.1"
description = "Bento - 本地项目开发与启动的 macOS 桌面应用"
authors = ["zhujiangyong"]
edition = "2021"

[lib]
name = "apphub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-autostart = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSEvent", "NSGraphicsContext", "NSView", "NSWindow"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "=0.6.2"

