[package]
name = "apphub"
version = "0.3.9"
description = "Bento - 本地项目开发与启动的 macOS 桌面应用"
authors = ["zhujiangyong"]
edition = "2021"

[lib]
name = "apphub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-utils = { version = "=2.9.3", features = ["config-json5", "config-toml"] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-autostart = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["full"] }
libc = "0.2"
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSURL", "NSData", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSString", "NSUserDefaults", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace", "libc"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "=0.6.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationResponse", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
